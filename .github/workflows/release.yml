name: 发布版本
on:
  push:
    tags: ['v*']
    branches: ['release/**']
  workflow_dispatch:
    inputs:
      publish:
        description: 发布为公开版本
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 检查版本与中文说明
        id: version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync, appendFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const manifest = JSON.parse(readFileSync('public/manifest.json', 'utf8'))
          assert.equal(pkg.version, manifest.version)
          const tag = 'v' + pkg.version
          if (process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch') {
            const expected = process.env.GITHUB_REF_TYPE === 'tag' ? tag : 'release/' + tag
            assert.equal(process.env.GITHUB_REF_NAME, expected)
          }
          const notes = readFileSync('docs/releases/' + tag + '.md', 'utf8')
          assert.ok(notes.trim().length > 0, '发布说明不能为空')
          assert.ok(/[\u3400-\u9fff]/u.test(notes), '发布说明须使用中文')
          assert.ok(!/^##?\s+English\b/m.test(notes), '发布说明仅使用中文')
          appendFileSync(process.env.GITHUB_OUTPUT, 'tag=' + tag + String.fromCharCode(10))
          JS
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:store
      - run: node scripts/verify-package.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node scripts/zip-dist.mjs
      - name: 保存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Foxtranslate-${{ steps.version.outputs.tag }}
          path: release/foxtranslate-*.zip
      - name: 创建中文发布及校验和
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PUBLISH: ${{ inputs.publish || (github.ref_type == 'branch' && startsWith(github.ref_name, 'release/')) }}
        run: |
          sha256sum release/foxtranslate-*.zip > release/SHA256SUMS.txt
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > /tmp/release-is-draft 2>/dev/null; then
            test "$(cat /tmp/release-is-draft)" = true || { echo "此版本已发布"; exit 1; }
            gh release upload "$TAG" release/foxtranslate-*.zip release/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file "docs/releases/$TAG.md" --title "Foxtranslate $TAG"
          else
            gh release create "$TAG" release/foxtranslate-*.zip release/SHA256SUMS.txt --draft --target "$GITHUB_SHA" --notes-file "docs/releases/$TAG.md" --title "Foxtranslate $TAG"
          fi
          if [ "$PUBLISH" = true ]; then
            gh release edit "$TAG" --draft=false --latest
          fi
