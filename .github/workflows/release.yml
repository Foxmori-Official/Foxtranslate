name: 发布版本
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notes_tag:
        description: 更新正文的已发布版本（例如 v0.0.1）
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.notes_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 检查版本与中文说明
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const manifest = JSON.parse(readFileSync('public/manifest.json', 'utf8'))
          assert.equal(pkg.version, manifest.version)
          assert.equal(process.env.GITHUB_REF_NAME, 'v' + pkg.version)
          const notes = readFileSync('docs/releases/' + process.env.GITHUB_REF_NAME + '.md', 'utf8')
          assert.ok(/[\u3400-\u9fff]/u.test(notes), '发布说明须使用中文')
          assert.ok(!/^##?\s+English\b/m.test(notes), '发布说明仅使用中文')
          JS
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:store
      - run: npm run verify:package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node scripts/zip-dist.mjs
      - name: 生成安装包校验和
        run: (cd release && sha256sum foxtranslate-*.zip > SHA256SUMS.txt)
      - name: 保存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Foxtranslate-${{ github.ref_name }}
          path: |
            release/foxtranslate-*.zip
            release/SHA256SUMS.txt
      - name: 公开发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$TAG.md"
          if draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$draft" = false ]; then
              echo "该标签已发布"
              exit 0
            fi
            gh release upload "$TAG" release/foxtranslate-*.zip release/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file "$notes" --title "Foxtranslate $TAG"
          else
            gh release create "$TAG" release/foxtranslate-*.zip release/SHA256SUMS.txt --verify-tag --draft --notes-file "$notes" --title "Foxtranslate $TAG"
          fi
          gh release edit "$TAG" --draft=false --latest

  update-notes:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 更新已发布版本正文
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.notes_tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          notes="docs/releases/$TAG.md"
          test -s "$notes"
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = false
          gh release edit "$TAG" --notes-file "$notes"
