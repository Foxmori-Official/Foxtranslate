name: 同步中文发布说明
on:
  push:
    branches: [main]
    paths:
      - docs/releases/**
      - .github/workflows/release-notes.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-notes
  cancel-in-progress: false
jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 核对中文说明与发布版本
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 --json tagName > /tmp/releases.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync, appendFileSync } from 'node:fs'
          const tag = 'v' + JSON.parse(readFileSync('package.json', 'utf8')).version
          const notes = readFileSync('docs/releases/' + tag + '.md', 'utf8')
          assert.ok(notes.trim().length > 0, '发布说明不能为空')
          assert.ok(/[\u3400-\u9fff]/u.test(notes), '发布说明须使用中文')
          assert.ok(!/^##?\s+English\b/m.test(notes), '发布说明仅使用中文')
          const releases = JSON.parse(readFileSync('/tmp/releases.json', 'utf8'))
          const exists = releases.some(release => release.tagName === tag)
          appendFileSync(process.env.GITHUB_OUTPUT, 'tag=' + tag + String.fromCharCode(10) + 'exists=' + exists + String.fromCharCode(10))
          if (!exists) console.log('该版本尚未发布，中文说明将用于后续发布。')
          JS
      - name: 更新发布正文与标题
        if: steps.release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$TAG" --notes-file "docs/releases/$TAG.md" --title "Foxtranslate $TAG"
