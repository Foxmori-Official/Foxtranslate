name: Reference project updates
on:
  push:
    paths:
      - docs/upstreams.json
      - docs/upstream-baseline.json
      - scripts/check-upstreams.mjs
      - scripts/upstream-issue.mjs
      - .github/workflows/upstreams.yml
  schedule:
    - cron: '17 1 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: upstream-report
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-upstreams.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: reference-updates
          path: reports/upstream-updates.*
      - name: Update the review issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/upstream-issue.mjs
