name: 检查与打包 / Check and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:store
      - run: node scripts/verify-package.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node scripts/zip-dist.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Foxtranslate
          path: release/foxtranslate-*.zip
